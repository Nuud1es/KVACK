[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qacopilot"
version = "0.1.0"
description = "KVACK core library: LLM providers, ingestion, retrieval, extraction, agent"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
tracing = ["langfuse>=3"]
metrics = ["prometheus-client>=0.20"]
db = ["sqlalchemy[asyncio]>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2"]
agent = ["langgraph>=1.0", "langgraph-checkpoint-postgres>=3.0", "psycopg-pool>=3.2"]
retrieval = ["fastembed>=0.4", "qdrant-client>=1.12"]
ingest = ["pymupdf>=1.24", "pytesseract>=0.3", "pillow>=10"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/qacopilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["pytesseract", "pytesseract.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF is only partly typed
module = "qacopilot.ingest.pdf"
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Windows-only; not installed on Linux
module = ["pythoncom", "win32com", "win32com.*"]
ignore_missing_imports = true
