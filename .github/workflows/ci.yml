name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      QACOPILOT_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-osd
      - run: pip install -e "packages/qacopilot[dev,tracing,ingest,retrieval,db,agent]" -e "services/api[dev]"
      - run: ruff check packages services evals
      - run: python services/api/export_openapi.py --check
      - run: mypy --config-file packages/qacopilot/pyproject.toml packages/qacopilot/src
      - run: mypy --config-file services/api/pyproject.toml services/api/src
      # Re-score the recorded eval results, check them against the committed floors, and fail if
      # a prompt changed without a version bump. Deterministic: no LLM, no model downloads.
      - run: python evals/check_recorded.py
      - run: pytest packages/qacopilot
      - run: pytest services/api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      # the typed client is generated from openapi.json; fail if the committed copy is stale
      - run: git diff --exit-code -- src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
